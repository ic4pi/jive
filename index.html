<!DOCTYPE html>

  <style>
    :root {
      --bg:        #050507;
      --bg2:       #0a0a0f;

      --border:    rgba(255,255,255,0.07);

      --accent:    #c8f53a;

      --accent3:   #3af5b4;
      --glow:      rgba(200,245,58,0.15);
      --glow2:     rgba(123,94,167,0.12);
      --user-bg:   rgba(200,245,58,0.05);
      --ai-bg:     rgba(255,255,255,0.02);
      --font-head: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --font-body: 'Inter', sans-serif;
      --r:         12px;
      --safe-b:    env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    /* ── Ambient canvas ── */
    #canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    /* ── Layout shell ── */
    #app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(5,5,7,0.7);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Desktop logo */
    .logo-desk {
      display: none;
      height: 32px;
      width: auto;
      object-fit: contain;
    }
    /* Mobile logo */
    .logo-mob {
      display: block;
      height: 32px;
      width: 32px;
      object-fit: cover;
      border-radius: 7px;
    }

    @media (min-width: 640px) {
      .logo-desk { display: block; }
      .logo-mob  { display: none; }
    }

    /* Fallback text logo if images missing */
    .logo-text {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Status dot */
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    /* Settings toggle */
    #settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 36px; height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    #settings-btn:hover, #settings-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--glow);
    }
    #settings-btn svg { width: 16px; height: 16px; }

    /* ── Settings drawer ── */
    #settings-drawer {
      position: absolute;
      top: calc(100% + 8px);
      right: 16px;
      width: min(380px, calc(100vw - 32px));
      background: rgba(10,10,16,0.96);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,245,58,0.05);
      transform-origin: top right;
    }
    #settings-drawer.open {
      display: flex;
      animation: drawer-in 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes drawer-in {
      from { opacity:0; transform: scale(0.92) translateY(-8px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .drawer-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .drawer-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .drawer-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s, background 0.2s;
    }
    .drawer-input:focus {
      border-color: var(--accent);
      background: rgba(200,245,58,0.04);
    }
    .drawer-input::placeholder { color: rgba(255,255,255,0.2); }

    select.drawer-input { cursor: pointer; }
    select.drawer-input option,
    select.drawer-input optgroup { background: #0f0f18; }

    .drawer-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 0 12px;
      scroll-behavior: smooth;
      position: relative;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    /* Empty state */
    #empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }
    .empty-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 1px solid rgba(200,245,58,0.2);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: ring-spin 8s linear infinite;
    }
    .empty-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(200,245,58,0.07);
      animation: ring-spin 12s linear infinite reverse;
    }
    .empty-ring::after {
      content: '';
      position: absolute;
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
      top: -2px; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px var(--accent);
    }
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }
    .empty-icon {
      font-size: 28px;
      filter: grayscale(0.3);
    }
    .empty-text {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Message rows */
    .msg-row {
      display: flex;
      gap: 0;
      padding: 6px 20px;
      position: relative;
      animation: msg-in 0.28s cubic-bezier(0.34,1.2,0.64,1);
    }
    @keyframes msg-in {
      from { opacity:0; transform: translateY(12px) scale(0.98); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .msg-row.user  { justify-content: flex-end; }
    .msg-row.ai    { justify-content: flex-start; }

    .bubble {
      max-width: min(72%, 520px);
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 14px;
      font-weight: 300;
      position: relative;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-row.user .bubble {
      background: linear-gradient(135deg, rgba(200,245,58,0.12) 0%, rgba(200,245,58,0.07) 100%);
      border: 1px solid rgba(200,245,58,0.2);
      border-bottom-right-radius: 5px;
      color: var(--text);
    }
    .msg-row.user .bubble::after {
      content: '';
      position: absolute;
      bottom: 0; right: -1px;
      width: 14px; height: 14px;
      background: linear-gradient(135deg, transparent 50%, rgba(200,245,58,0.08) 50%);
      border-right: 1px solid rgba(200,245,58,0.2);
      border-bottom: 1px solid rgba(200,245,58,0.2);
      border-bottom-right-radius: 4px;
    }

    .msg-row.ai .bubble {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      color: var(--text);

    .bubble.error { color: #ff6b6b; border-color: rgba(255,107,107,0.25); background: rgba(255,107,107,0.05); }

    /* AI avatar */
    .ai-avatar {

      flex-shrink: 0;
      align-self: flex-end;
      margin-right: 8px;
      box-shadow: 0 0 12px rgba(123,94,167,0.3);
    }

    /* Code */
    .bubble pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
    }
    .bubble code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(255,255,255,0.07);
      padding: 2px 5px;
      border-radius: 4px;
    }
    .bubble pre code { background: none; padding: 0; }

    /* Typing */
    .typing-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }
    .t-dot {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: tdot 1.3s ease-in-out infinite;
      box-shadow: 0 0 6px var(--accent);
    }
    .t-dot:nth-child(2) { animation-delay: 0.15s; background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }
    .t-dot:nth-child(3) { animation-delay: 0.3s; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity:0.4; }
      30%          { transform: translateY(-6px); opacity:1; }
    }

    /* Token strip */
    #token-strip {
      display: none;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      padding: 4px 0 0;
      letter-spacing: 0.08em;
    }
    #token-strip.visible { display: block; }

    /* ── Footer / Input ── */
    footer {
      flex-shrink: 0;
      padding: 12px 16px calc(12px + var(--safe-b));
      background: rgba(5,5,7,0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
    }

    .input-shell {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-shell:focus-within {
      border-color: rgba(200,245,58,0.35);
      box-shadow: 0 0 0 3px rgba(200,245,58,0.06), 0 0 24px rgba(200,245,58,0.04);
    }

    #input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px; /* prevents iOS zoom */
      font-weight: 300;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      padding: 0;
    }
    #input::placeholder { color: rgba(240,240,238,0.22); }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #050507;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 16px rgba(200,245,58,0.3);
    }
    #send-btn:hover { transform: scale(1.07); box-shadow: 0 0 24px rgba(200,245,58,0.5); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    #send-btn svg { width: 16px; height: 16px; }

    /* Scan line overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* Scrolldown fade */
    #messages::before {
      content: '';
      position: sticky;
      top: 0;
      display: block;
      height: 32px;
      background: linear-gradient(to bottom, var(--bg), transparent);
      pointer-events: none;
      z-index: 2;
      margin-bottom: -32px;
    }
  </style>
</head>

  </footer>

<script>
/* ── Ambient canvas ── */
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let w, h, orbs = [];

  function resize() {
    w = canvas.width  = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function makeOrb() {
    return {
      x:    Math.random() * w,
      y:    Math.random() * h,
      r:    80 + Math.random() * 180,
      dx:   (Math.random() - 0.5) * 0.3,
      dy:   (Math.random() - 0.5) * 0.3,
      hue:  Math.random() < 0.5 ? [200, 245, 58] : (Math.random() < 0.5 ? [123, 94, 167] : [58, 245, 180]),
      a:    0.04 + Math.random() * 0.06
    };
  }

  resize();
  for (let i = 0; i < 5; i++) orbs.push(makeOrb());
  window.addEventListener('resize', resize);

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const o of orbs) {
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      g.addColorStop(0, `rgba(${o.hue},${o.a})`);
      g.addColorStop(1, `rgba(${o.hue},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fill();
      o.x += o.dx; o.y += o.dy;
      if (o.x < -o.r || o.x > w + o.r) o.dx *= -1;
      if (o.y < -o.r || o.y > h + o.r) o.dy *= -1;
    }
    requestAnimationFrame(draw);
  }
  draw();

  /* ripple on send */
  window.spawnRipple = function(x, y) {
    const start = performance.now();
    function frame(now) {
      const t = (now - start) / 600;
      if (t > 1) return;
      const r = t * 120;
      ctx.strokeStyle = `rgba(200,245,58,${(1-t)*0.3})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };
})();

/* ── App state ── */
let history = [], totalTokens = 0, isStreaming = false;

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const emptyEl    = document.getElementById('empty');
const tokenStrip = document.getElementById('token-strip');

/* ── Restore keys ── */
const savedKey = localStorage.getItem('or_api_key');
if (savedKey) document.getElementById('api-key').value = savedKey;
const savedVen = localStorage.getItem('venice_api_key');
if (savedVen)  document.getElementById('venice-key').value = savedVen;

document.getElementById('api-key').addEventListener('change', e =>
  localStorage.setItem('or_api_key', e.target.value.trim()));
document.getElementById('venice-key').addEventListener('change', e =>
  localStorage.setItem('venice_api_key', e.target.value.trim()));

/* ── Settings drawer ── */
function toggleSettings() {
  const d = document.getElementById('settings-drawer');
  const b = document.getElementById('settings-btn');
  const open = d.classList.toggle('open');
  b.classList.toggle('active', open);
}
document.addEventListener('click', e => {
  const d = document.getElementById('settings-drawer');
  const b = document.getElementById('settings-btn');
  if (d.classList.contains('open') && !d.contains(e.target) && !b.contains(e.target)) {
    d.classList.remove('open');
    b.classList.remove('active');
  }
});

/* ── Model ── */
function onModelChange() {
  const v = document.getElementById('model-select').value;
  document.getElementById('custom-field').style.display = v === 'custom' ? 'flex' : 'none';
  if (v === 'custom') document.getElementById('custom-model').focus();
}
function getModel() {
  const v = document.getElementById('model-select').value;
  return v === 'custom' ? document.getElementById('custom-model').value.trim() : v;
}
function getKey() {
  const model = getModel();
  const venice = localStorage.getItem('venice_api_key');
  if (venice && model.includes('dolphin')) return { key: venice, url: 'https://api.venice.ai/api/v1/chat/completions' };
  return { key: localStorage.getItem('or_api_key') || '', url: 'https://openrouter.ai/api/v1/chat/completions' };
}

/* ── Textarea ── */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

/* Desktop: Enter sends */
const isMobile = () => /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isMobile()) {
    e.preventDefault();
    send();
  }
});

/* ── Render ── */
function render(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

/* ── Append message ── */
function appendMsg(role, text, isTyping) {
  if (emptyEl.parentNode) emptyEl.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'ai-avatar';
    av.textContent = '⬡';
    row.appendChild(av);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';

  if (isTyping) {
    bub.innerHTML = '<div class="typing-wrap"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>';
  } else {
    bub.innerHTML = render(text);
  }

  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bub;
}

function setLoading(v) {
  isStreaming = v;
  sendBtn.disabled = v;
  document.getElementById('status-dot').style.background = v ? 'var(--accent3)' : 'var(--accent)';
  document.getElementById('status-dot').style.boxShadow  = v ? '0 0 8px var(--accent3)' : '0 0 8px var(--accent)';
}

/* ── Send ── */
async function send() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;

  const { key, url } = getKey();
  if (!key) {
    // Pulse settings button to hint user
    const b = document.getElementById('settings-btn');
    b.style.borderColor = 'var(--accent)';
    b.style.color = 'var(--accent)';
    setTimeout(() => { b.style.borderColor=''; b.style.color=''; }, 1200);
    toggleSettings();
    return;
  }

  const model = getModel();
  if (!model) return;

  // Ripple
  const r = sendBtn.getBoundingClientRect();
  spawnRipple(r.left + r.width/2, r.top + r.height/2);

  inputEl.value = '';
  inputEl.style.height = 'auto';
  history.push({ role: 'user', content: text });
  appendMsg('user', text, false);
  setLoading(true);
  const bubble = appendMsg('ai', '', true);

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
        'HTTP-Referer': window.location.href,
        'X-Title': 'JiveAI'
      },
      body: JSON.stringify({ model, messages: history, stream: true })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '', usage = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of dec.decode(value).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          full += j.choices?.[0]?.delta?.content || '';
          bubble.innerHTML = render(full) || '<div class="typing-wrap"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>';
          messagesEl.scrollTop = messagesEl.scrollHeight;
          if (j.usage) usage = j.usage;
        } catch {}
      }
    }

    history.push({ role: 'assistant', content: full });

    if (usage) {
      totalTokens += usage.total_tokens || 0;
      tokenStrip.textContent = `↑${usage.prompt_tokens}  ↓${usage.completion_tokens}  ·  ${totalTokens} total`;
      tokenStrip.classList.add('visible');
    }

  } catch (err) {
    bubble.classList.add('error');
    bubble.textContent = `${err.message}`;
    history.pop();
  }

  setLoading(false);
}

function clearChat() {
  history = []; totalTokens = 0;
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyEl);
  tokenStrip.classList.remove('visible');
  toggleSettings();
}
</script>
</body>
</html>
