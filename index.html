<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JiveAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="OR Chat"/>
  <meta name="theme-color" content="#0e0e0f"/>
  <link rel="apple-touch-icon" href="/icon-192.jpeg"/>
  <link rel="icon" type="image/jpeg" sizes="192x192" href="/icon-192.jpeg"/>
  <link rel="manifest" href="/manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #161618;
      --border: #2a2a2e;
      --text: #e8e8e6;
      --muted: #666;
      --accent: #e8f04a;
      --accent-dim: rgba(232,240,74,0.12);
      --user-bg: #1e1e22;
      --assistant-bg: #131315;
      --radius: 6px;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      gap: 12px;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 640px;
    }

    select, input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }
    select { flex: 1; cursor: pointer; }
    input[type="password"] { flex: 1.2; }

    select option { background: #1a1a1c; }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      gap: 16px;
      padding: 16px 24px;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { background: var(--user-bg); }
    .message.assistant { background: var(--assistant-bg); }
    .message.error .content { color: #f07070; font-family: var(--font-mono); font-size: 12px; }

    .role-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-top: 2px;
      width: 60px;
      flex-shrink: 0;
    }
    .user .role-tag { color: var(--accent); }
    .assistant .role-tag { color: var(--muted); }

    .content {
      flex: 1;
      line-height: 1.7;
      font-size: 14px;
      font-weight: 300;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Code blocks */
    .content code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .content pre {
      background: #0a0a0b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .content pre code {
      background: none;
      padding: 0;
      font-size: 12px;
    }

    /* Typing indicator */
    .typing-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%,80%,100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* Empty state */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--muted);
    }
    #empty .big { font-family: var(--font-mono); font-size: 28px; color: var(--border); }
    #empty p { font-size: 13px; }

    /* Input area */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 900px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 300;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 200px;
      transition: border-color 0.15s;
      overflow-y: auto;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      color: #0e0e0f;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      letter-spacing: 0.03em;
      height: 40px;
    }
    #send-btn:hover { opacity: 0.88; }
    #send-btn:active { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .token-info {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 600px) {
      header { flex-wrap: wrap; }
      .header-controls { max-width: 100%; }
      .message { padding: 12px 14px; gap: 10px; }
      .role-tag { width: 44px; font-size: 9px; }
      footer { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⬡ JiveAI </div>
  <div class="header-controls">
    <input type="password" id="api-key" placeholder="sk-or-v1-… API key" autocomplete="off"/>
    <select id="model-select">
      <optgroup label="Venice (Uncensored)">
        <option value="cognitivecomputations/dolphin-mistral-24b-venice-edition:free">🐬 Dolphin Venice — Free</option>
        <option value="cognitivecomputations/dolphin-mistral-24b-venice-edition">🐬 Dolphin Venice — Paid</option>
      </optgroup>
      <optgroup label="Anthropic">
        <option value="anthropic/claude-sonnet-4-5">Claude Sonnet 4.5</option>
        <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
        <option value="anthropic/claude-3-opus">Claude 3 Opus</option>
      </optgroup>
      <optgroup label="OpenAI">
        <option value="openai/gpt-4o">GPT-4o</option>
        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        <option value="openai/o3-mini">o3-mini</option>
      </optgroup>
      <optgroup label="Google">
        <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash</option>
        <option value="google/gemini-pro-1.5">Gemini 1.5 Pro</option>
      </optgroup>
      <optgroup label="Meta">
        <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B</option>
      </optgroup>
      <optgroup label="Mistral">
        <option value="mistralai/mistral-large">Mistral Large</option>
        <option value="mistralai/mistral-7b-instruct">Mistral 7B</option>
      </optgroup>
      <optgroup label="DeepSeek">
        <option value="deepseek/deepseek-r1">DeepSeek R1</option>
        <option value="deepseek/deepseek-chat">DeepSeek Chat</option>
      </optgroup>
    </select>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</header>

<div id="messages">
  <div id="empty">
    <div class="big">⬡</div>
    <p>Enter your API key and start chatting.</p>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Message…" maxlength="32000"></textarea>
    <button id="send-btn" onclick="send()">Send ↵</button>
  </div>
  <div class="token-info" id="token-info"></div>
</footer>

<script>
  let history = [];
  let totalTokens = 0;
  let isStreaming = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');
  const tokenInfo  = document.getElementById('token-info');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
  });

  // Cmd/Ctrl+Enter or Enter (no shift) to send
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Persist API key
  const savedKey = localStorage.getItem('or_api_key');
  if (savedKey) document.getElementById('api-key').value = savedKey;
  document.getElementById('api-key').addEventListener('change', e => {
    localStorage.setItem('or_api_key', e.target.value.trim());
  });

  function getKey()   { return document.getElementById('api-key').value.trim(); }
  function getModel() { return document.getElementById('model-select').value; }

  function appendMessage(role, content, isTyping = false) {
    emptyEl.style.display = 'none';
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <span class="role-tag">${role === 'user' ? 'You' : 'AI'}</span>
      <div class="content">${isTyping
        ? '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>'
        : escapeHtml(content)
      }</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div.querySelector('.content');
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(v) {
    isStreaming = v;
    sendBtn.disabled = v;
    sendBtn.textContent = v ? '…' : 'Send ↵';
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    const key = getKey();
    if (!key) { alert('Paste your OpenRouter API key first.'); return; }

    inputEl.value = '';
    inputEl.style.height = 'auto';

    history.push({ role: 'user', content: text });
    appendMessage('user', text);

    setLoading(true);
    const contentEl = appendMessage('assistant', '', true);

    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`,
          'HTTP-Referer': window.location.href,
          'X-Title': 'OpenRouter Chat'
        },
        body: JSON.stringify({
          model: getModel(),
          messages: history,
          stream: true
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      let usage = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

        for (const line of lines) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            full += delta;
            contentEl.innerHTML = escapeHtml(full) || '…';
            scrollToBottom();
            if (json.usage) usage = json.usage;
          } catch {}
        }
      }

      history.push({ role: 'assistant', content: full });

      if (usage) {
        totalTokens += (usage.total_tokens || 0);
        tokenInfo.textContent =
          `last: ${usage.prompt_tokens}↑ ${usage.completion_tokens}↓ · session: ${totalTokens} tokens`;
      }

    } catch (err) {
      contentEl.closest('.message').classList.add('error');
      contentEl.textContent = `Error: ${err.message}`;
      history.pop(); // remove user message from history on error
    }

    setLoading(false);
  }

  function clearChat() {
    history = [];
    totalTokens = 0;
    tokenInfo.textContent = '';
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    emptyEl.style.display = 'flex';
  }
</script>
</body>
</html>
