<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JiveAI</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: #ddd; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #444; color: #ddd; border-radius: 8px; }
        button { background: #0f0; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #0c0; }
        .chat { height: 60vh; overflow-y: auto; padding: 15px; background: #1a1a1a; border-radius: 8px; margin: 15px 0; }
        .message { margin: 12px 0; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #333; margin-left: auto; }
        .ai { background: #222; }
        .settings { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color:#0f0">JiveAI</h1>
        
        <div class="settings">
            <input type="password" id="openrouter" placeholder="OpenRouter API Key (sk-or-...)">
            <input type="password" id="venice" placeholder="Venice API Key (optional)">
            <select id="model">
                <option value="">Select Model...</option>
                <option value="openai/gpt-4o">OpenAI GPT-4o (OpenRouter)</option>
                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
            </select>
            <button onclick="saveSettings()">Save Keys & Model</button>
        </div>

        <div class="chat" id="chat"></div>

        <div style="display:flex; gap:10px;">
            <input type="text" id="input" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
        <button onclick="clearChat()" style="background:#f00;color:#fff;margin-top:10px">Clear Conversation</button>
    </div>

    <script>
        function saveSettings() {
            localStorage.setItem('openrouter', document.getElementById('openrouter').value.trim());
            localStorage.setItem('venice', document.getElementById('venice').value.trim());
            localStorage.setItem('model', document.getElementById('model').value);
            alert('Settings saved');
        }

        function loadSettings() {
            document.getElementById('openrouter').value = localStorage.getItem('openrouter') || '';
            document.getElementById('venice').value = localStorage.getItem('venice') || '';
            document.getElementById('model').value = localStorage.getItem('model') || '';
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            input.value = '';

            const model = localStorage.getItem('model');
            const key = localStorage.getItem('openrouter');

            if (!key || !model) {
                addMessage('Missing API key or model', 'ai');
                return;
            }

            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'JiveAI'
                    },
                    body: JSON.stringify({
                        model: model.split('/')[1] || model,
                        messages: [{ role: 'user', content: msg }]
                    })
                });

                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content || 'No response';
                addMessage(reply, 'ai');
            } catch (e) {
                addMessage('Error: ' + e.message, 'ai');
            }
        }

        function addMessage(text, sender) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chat').innerHTML = '';
        }

        // Init
        window.onload = loadSettings;
    </script>
</body>
</html>
