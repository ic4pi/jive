<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JiveAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="JiveAI"/>
  <meta name="theme-color" content="#0e0e0f"/>
  <link rel="apple-touch-icon" href="/icon-192.jpeg"/>
  <link rel="icon" type="image/jpeg" sizes="192x192" href="/icon-192.jpeg"/>
  <link rel="manifest" href="/manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0c;
      --surface: #161618;
      --border: #2a2a2e;
      --text: #e8e8e6;
      --muted: #777;
      --accent: #e8f04a;
      --accent-glow: #e8f04a88;
      --user-bg: #1e1e22;
      --assistant-bg: #131315;
      --radius: 8px;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(22, 22, 24, 0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    select, input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    select { flex: 1; cursor: pointer; }
    input[type="password"] { flex: 1.1; }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .clear-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,240,74,0.08);
    }

    /* Messages Area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scroll-behavior: smooth;
      position: relative;
      background: radial-gradient(circle at center, rgba(232,240,74,0.03) 0%, transparent 70%);
    }

    #messages::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      max-width: 65%;
      max-height: 65%;
      background: url('/icon-512.JPEG') center/contain no-repeat;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      filter: brightness(1.15) drop-shadow(0 0 40px var(--accent));
      transition: opacity 0.4s;
    }

    #messages:hover::before { opacity: 0.22; }

    #messages > * { position: relative; z-index: 1; }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

    .message {
      display: flex;
      gap: 18px;
      padding: 18px 28px;
      animation: fadeUp 0.3s ease;
      max-width: 860px;
      margin: 0 auto;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { background: var(--user-bg); }
    .message.assistant { background: var(--assistant-bg); }
    .message.error .content { color: #ff6b6b; }

    .role-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-top: 3px;
      width: 52px;
      flex-shrink: 0;
      color: var(--muted);
    }
    .user .role-tag { color: var(--accent); }

    .content {
      flex: 1;
      line-height: 1.75;
      font-size: 14.5px;
      font-weight: 300;
    }

    /* Empty */
    #empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      pointer-events: none;
    }
    #empty .big { font-size: 22px; opacity: 0.4; }

    /* Input */
    footer {
      border-top: 1px solid var(--border);
      background: rgba(22,22,24,0.98);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      max-height: 220px;
      transition: all 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #send-btn {
      background: var(--accent);
      color: #0e0e0f;
      border: none;
      padding: 12px 22px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      height: 48px;
    }
    #send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }

    .token-info {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 640px) {
      .message { padding: 14px 16px; gap: 12px; }
      #messages::before { width: 280px; height: 280px; }
      textarea { font-size: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-controls">
    <input type="password" id="api-key" placeholder="sk-or-v1-… API key" autocomplete="off"/>
    <select id="model-select">
      <optgroup label="Dolphin Free">
        <option value="cognitivecomputations/dolphin-mistral-24b-venice-edition:free">🐬 Dolphin Venice Free</option>
      </optgroup>
      <optgroup label="Free OpenRouter">
        <option value="qwen/qwen2.5-72b-instruct:free">Qwen2.5 72B</option>
        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B</option>
        <option value="meta-llama/llama-3.1-405b-instruct:free">Llama 3.1 405B</option>
        <option value="google/gemma-2-27b-it:free">Gemma 2 27B</option>
        <option value="mistralai/mixtral-8x22b-instruct:free">Mixtral 8x22B</option>
        <option value="deepseek/deepseek-r1:free">DeepSeek R1</option>
        <option value="deepseek/deepseek-chat:free">DeepSeek Chat</option>
        <option value="qwen/qwen2-72b-instruct:free">Qwen2 72B</option>
        <option value="mistralai/mistral-7b-instruct:free">Mistral 7B</option>
        <option value="google/gemma-2-9b-it:free">Gemma 2 9B</option>
        <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B</option>
        <option value="qwen/qwen2.5-coder-32b-instruct:free">Qwen Coder 32B</option>
        <option value="mistralai/mistral-small-24b-instruct:free">Mistral Small 24B</option>
        <option value="google/gemma-2-2b-it:free">Gemma 2 2B</option>
        <option value="meta-llama/llama-3.2-11b-vision:free">Llama 3.2 11B</option>
        <option value="qwen/qwen2.5-32b-instruct:free">Qwen2.5 32B</option>
      </optgroup>
    </select>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</header>

<div id="messages">
  <div id="empty">
    <div class="big">⬡</div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Message…" maxlength="32000"></textarea>
    <button id="send-btn" onclick="send()">Send ↵</button>
  </div>
  <div class="token-info" id="token-info"></div>
</footer>

<script>
  let history = [];
  let totalTokens = 0;
  let isStreaming = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');
  const tokenInfo  = document.getElementById('token-info');

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 220) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  const savedKey = localStorage.getItem('or_api_key');
  if (savedKey) document.getElementById('api-key').value = savedKey;
  document.getElementById('api-key').addEventListener('change', e => {
    localStorage.setItem('or_api_key', e.target.value.trim());
  });

  function getKey() { return document.getElementById('api-key').value.trim(); }
  function getModel() { return document.getElementById('model-select').value; }

  function appendMessage(role, content, isTyping = false) {
    emptyEl.style.display = 'none';
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <span class="role-tag">${role === 'user' ? 'YOU' : 'AI'}</span>
      <div class="content">${isTyping ? '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>' : escapeHtml(content)}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div.querySelector('.content');
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(v) {
    isStreaming = v;
    sendBtn.disabled = v;
    sendBtn.textContent = v ? '…' : 'Send ↵';
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    const key = getKey();
    if (!key) {
      const contentEl = appendMessage('assistant', '', false);
      contentEl.closest('.message').classList.add('error');
      contentEl.textContent = 'Paste your OpenRouter API key in the header.';
      setLoading(false);
      return;
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';

    history.push({ role: 'user', content: text });
    appendMessage('user', text);

    setLoading(true);
    const contentEl = appendMessage('assistant', '', true);

    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`,
          'HTTP-Referer': window.location.href,
          'X-Title': 'JiveAI'
        },
        body: JSON.stringify({ model: getModel(), messages: history, stream: true })
      });

      if (!res.ok) throw new Error((await res.json()).error?.message || `HTTP ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
        for (const line of lines) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            full += delta;
            contentEl.innerHTML = escapeHtml(full) || '…';
            scrollToBottom();
          } catch {}
        }
      }

      history.push({ role: 'assistant', content: full });
    } catch (err) {
      contentEl.closest('.message').classList.add('error');
      contentEl.textContent = `Error: ${err.message}`;
      history.pop();
    }

    setLoading(false);
  }

  function clearChat() {
    history = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    emptyEl.style.display = 'flex';
  }
</script>
</body>
</html>
